name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new livekit-agents release that breaks the plugin shows up
    # even when nothing here changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        dependencies: [newest]
        include:
          # The oldest versions pyproject.toml allows, livekit-agents 1.8.0 among them.
          - python-version: "3.10"
            dependencies: oldest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the oldest allowed versions
        if: matrix.dependencies == 'oldest'
        run: uv sync --resolution lowest-direct
      - name: Install the newest versions
        if: matrix.dependencies == 'newest'
        run: uv sync --upgrade
      - run: uv pip list | grep -i -E "^(livekit-agents|aiohttp) "
      - run: uv run --no-sync pytest -q

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build

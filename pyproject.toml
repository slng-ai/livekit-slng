[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "livekit-slng"
dynamic = ["version"]
description = "SLNG plugin for LiveKit Agents: speech-to-text and text-to-speech through SLNG"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "SLNG", email = "hello@slng.ai" }]
keywords = ["voice", "ai", "realtime", "audio", "livekit", "slng", "stt", "tts"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10",
    "livekit-agents>=1.8,<2",
    "livekit-blingfire>=1.1,<2",
]

[project.urls]
Documentation = "https://docs.slng.ai/"
Source = "https://github.com/slng-ai/livekit-slng"
Changelog = "https://github.com/slng-ai/livekit-slng/blob/main/CHANGELOG.md"
Website = "https://slng.ai/"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/livekit_slng/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/livekit_slng"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "RUF006", # asyncio-dangling-task: the event loop only weakly references a bare task
]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["livekit_slng"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
disallow_any_generics = false
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
